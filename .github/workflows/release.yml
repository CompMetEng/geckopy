name: release

# Builds a wheel + sdist when a release is published, attaches them to
# the GitHub release, and publishes to PyPI via Trusted Publishing (OIDC,
# no stored token).
#
# One-time setup required before this can succeed (not done by this file):
# 1. Register trusted publishing for the `geckopy` project at
#    https://pypi.org/manage/project/geckopy/settings/publishing/ , pointing
#    at this repo, workflow filename `release.yml`, and environment `pypi`.
# 2. Create a `pypi` environment in this repo's Settings -> Environments.

on:
  release:
    types: [published]
  workflow_dispatch:  # allow manual builds without a release for testing

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    # softprops/action-gh-release uses the workflow GITHUB_TOKEN to attach
    # assets to the release; without contents:write it fails with HTTP 403
    # "Resource not accessible by integration". Repos created after the
    # 2023 GITHUB_TOKEN-permissions tightening default to read-only, so
    # this needs to be declared explicitly.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build
        run: pip install build

      - name: Build distributions
        run: python -m build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Attach to GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  pypi-publish:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi  # configure in repo settings -> Environments
    permissions:
      id-token: write  # OIDC trusted publishing; no API token needed
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
