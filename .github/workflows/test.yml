name: tests

on:
  push:
    branches: [master, main]
  pull_request:

# Cancel in-progress runs of this workflow on the same ref when a new
# push lands; saves runner minutes on rapid iteration.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Full Python range on Linux; a single Python on macOS/Windows to catch
        # OS-specific issues at low runner cost.
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - { os: macos-latest, python-version: "3.12" }
          - { os: windows-latest, python-version: "3.12" }
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev,evotune]"

      - name: Run pytest
        run: pytest -q
