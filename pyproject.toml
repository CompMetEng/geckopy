[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geckopy"
version = "4.0.0b1"
description = "Enzyme-constrained genome-scale metabolic modeling in Python, inspired by the GECKO Toolbox"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Eduard Kerkhoven", email = "eduardk@chalmers.se" },
]
keywords = [
    "ecmodel",
    "enzyme-constrained",
    "gecko",
    "metabolic-model",
    "cobra",
    "systems-biology",
    "constraint-based-modeling",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    # >=0.31.1: earlier cobra versions carry a Reaction.__copy__/__deepcopy__
    # override that recurses infinitely (RecursionError) on Python 3.14 for
    # any model with a reaction<->metabolite reference cycle -- i.e. any real
    # cobra model. Fixed upstream by deleting that override.
    "cobra>=0.31.1",
    "numpy>=1.21",
    "pandas>=2",
    "pydantic>=2",
    # raven-toolbox provides the underlying model-manipulation primitives geckopy
    # extends, plus the ecModel YAML I/O (raven_toolbox.io.ec_data.EcData and the
    # ec-rxns / ec-enzymes / gecko_light sections in read/write_yaml_model).
    # >=3.0.0b1: first release carrying convert_to_irreversible(..., rxns=...),
    # which make_ec_model needs (#42). The "b1" in the specifier opts pip into
    # matching pre-releases, so no --pre flag is needed downstream.
    "raven-toolbox>=3.0.0b1",
    "requests>=2.28",
    "ruamel.yaml>=0.17",
    "scipy>=1.10",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
    "ruff>=0.4",
]
tutorial = [
    "matplotlib>=3.5",
]
evotune = [
    "cma>=3.3",
]

[project.urls]
Homepage = "https://github.com/CompMetEng/geckopy"
Source = "https://github.com/CompMetEng/geckopy"
Issues = "https://github.com/CompMetEng/geckopy/issues"
"GECKO MATLAB" = "https://github.com/CompMetEng/GECKO"
"raven-toolbox" = "https://github.com/CompMetEng/raven-toolbox"

[project.scripts]
geckopy = "geckopy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/geckopy"]
# kcat.tsv/sa.tsv/mw.tsv/measurements.tsv are shipped xz-compressed instead -- see
# hatch_build.py and src/geckopy/databases/brenda_loader.py.
exclude = [
    "src/geckopy/data/brenda/kcat.tsv",
    "src/geckopy/data/brenda/sa.tsv",
    "src/geckopy/data/brenda/mw.tsv",
    "src/geckopy/data/brenda/measurements.tsv",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Smoke tests are opt-in (they need external data and can take minutes);
# run them with `pytest -m smoke`. The default invocation excludes them.
addopts = "-m 'not smoke'"
markers = [
    "smoke: real-scale smoke tests that need external data (e.g. Human-GEM). Opt-in with `pytest -m smoke`; auto-skipped when the data isn't present.",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tutorials/"]

[tool.ruff.lint]
# Start with actual-error rules only; modernization (I, UP, B) and
# import sorting can be enabled in a follow-up PR after a one-shot
# `ruff check --fix && ruff format` cleanup pass.
select = ["E", "F", "W"]
ignore = [
    "E501",  # line length handled separately by formatter, not lint
    "E702",  # `R.lower_bound = 0; R.upper_bound = 1000` is intentional in test fixtures
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # allow late imports in test files
