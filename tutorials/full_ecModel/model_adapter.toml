# Adapter parameters for the full_ecModel tutorial.
# Mirrors GECKO MATLAB tutorials/full_ecModel/YeastGEMAdapter.m.

conv_gem = "models/yeast-GEM.yml"

org_name = "saccharomyces cerevisiae"

sigma = 0.5
p_tot = 0.5
f = 0.5
gr_exp = 0.41

c_source = "r_1714"
bio_rxn = "r_4041"
enzyme_comp = "cytoplasm"

[kegg]
id = "sce"
gene_id = "kegg"

[uniprot]
type = "proteome"
id = "UP000002311"
gene_id_field = "gene_oln"
reviewed = true

[complex]
taxonomic_id = 559292

# Kcat assignment (assign_kcats): the stages of the gecko_median preset,
# with the BRENDA aggregation that kcats_from_brenda takes from
# kcat_aggregate_brenda (the maximum).
[[kcat_assignment.stage]]
sources = ["custom", "database_top", "dlkcat", "database_bottom"]
top_origin_limit = 4

[evotune]
sigma0_log_default = 0.3
rmse_threshold = 0.2
# CMA-ES generations. 212 approximates a 6800-evaluation budget at
# cmaes_kcat_tuning's own default population size for ~110 free
# parameters; a different tunable-set size changes that population
# size and so the evaluation count this actually spends.
max_generations = 212
# Weights the max-growth term against the flux term,
# (rmse_flux + w * rmse_max_growth) / (w + 1): the eight max-growth
# conditions count double against the 33 flux conditions, which are
# 30 parts glucose. Same field and value as MATLAB's maxGrowthWeight.
max_growth_weight = 2.0

# Trust tiers, least to most trusted. This model labels predicted kcats
# "OpenKineticsPredictor"; match_okp additionally catches models that label
# them with the predictor method name (OkpParams.method) instead.
[evotune.source_groups.okp]
sources = ["OpenKineticsPredictor"]
match_okp = true

[evotune.source_groups.brenda]
sources = ["brenda"]

[evotune.source_groups.custom]
sources = ["custom"]

[evotune.sigma0_log_source]
okp = 0.25
brenda = 0.2
custom = 0.1

